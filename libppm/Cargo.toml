[package]
name = "libppm"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bumpalo = "3"
libc = "0.2"
libflatpak = "0.7"
md5 = "0.7"
memmap2 = "0.9"
milli = { path = "crates/milli", features = [
    "chinese",
    "german",
    "greek",
    "hebrew",
    "japanese-transliteration",
    "khmer",
    "swedish-recomposition",
    "thai",
    "turkish",
    "vietnamese",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
xattr = "1"
zstd = "0.13"
