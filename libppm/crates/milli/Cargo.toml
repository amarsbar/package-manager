[package]
name = "milli"
version = "1.53.1"
edition = "2021"
publish = false
authors = [
    "Quentin de Quelen <quentin@dequelen.me>",
    "Clément Renault <clement@meilisearch.com>",
]
description = "Stripped milli lexical search implementation for the package manager"
homepage = "https://meilisearch.com"
readme = "README.md"
license = "MIT"

[dependencies]
big_s = "1.0.2"
bytemuck = { version = "1.24.0", features = ["extern_crate_alloc"] }
byteorder = "1.5.0"
charabia = { path = "../charabia", default-features = false }
either = { version = "1.15.0", features = ["serde"] }
fst = "0.4.7"
fxhash = "0.2.1"
grenad = { version = "0.5.0", default-features = false, features = [
    "rayon",
    "tempfile",
] }
heed = { version = "0.22.1", default-features = false, features = [
    "serde-json",
] }
levenshtein_automata = { version = "0.2.1", features = ["fst_automaton"] }
memmap2 = "0.9.9"
obkv = "0.3.0"
once_cell = "1.21.3"
ordered-float = "5.1.0"
permissive-json-pointer = { path = "../permissive-json-pointer" }
rayon = "1.11.0"
roaring = { version = "0.10.12", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "raw_value"] }
smallstr = { version = "0.3.1", features = ["serde"] }
smallvec = "1.15.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
# documents words self-join
itertools = "0.14.0"

tracing = "0.1.41"
hashbrown = "0.15.5"
bumpalo = "3.19.0"
bumparaw-collections = "0.1.4"
steppe = { version = "0.4", default-features = false }
thread_local = "1.1.9"
rustc-hash = "2.1.1"
bbqueue = { path = "../bbqueue" }
flume = { version = "0.11.1", default-features = false }

[features]
# Use POSIX semaphores instead of SysV semaphores in LMDB
# For more information on this feature, see heed's Cargo.toml
lmdb-posix-sem = ["heed/posix-sem"]

# allow chinese specialized tokenization
chinese = ["charabia/chinese"]

enterprise = []

# allow hebrew specialized tokenization
hebrew = ["charabia/hebrew"]

japanese-transliteration = ["charabia/japanese-transliteration"]

# allow thai specialized tokenization
thai = ["charabia/thai"]

# allow greek specialized tokenization
greek = ["charabia/greek"]

# allow khmer specialized tokenization
khmer = ["charabia/khmer"]

# allow vietnamese specialized tokenization
vietnamese = ["charabia/vietnamese"]

# allow german specialized tokenization
german = ["charabia/german-segmentation"]

# force swedish character recomposition
swedish-recomposition = ["charabia/swedish-recomposition"]

# allow turkish specialized tokenization
turkish = ["charabia/turkish"]
